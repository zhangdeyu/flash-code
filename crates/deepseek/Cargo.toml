[package]
name = "flash-deepseek"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flash_deepseek"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
flash-core = { path = "../core" }
flash-provider = { path = "../provider" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
flash-tools = { path = "../tools" }

[lints]
workspace = true
