license.workspace = true

[lib]
name = "flash_provider"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
flash-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
