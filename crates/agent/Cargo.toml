[package]
name = "flash-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flash_agent"
path = "src/lib.rs"

[features]
default = []
# Enables the deterministic in-process `SmokeProvider` used by the CLI
# `--provider smoke` entry point and the eval harness. Gated out of the
# default build so the production runtime does not carry eval simulation.
smoke = []

[dependencies]
async-trait = "0.1"
flash-core = { path = "../core" }
flash-provider = { path = "../provider" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
flash-deepseek = { path = "../deepseek" }
flash-tools = { path = "../tools" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
