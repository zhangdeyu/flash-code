[package]
name = "flash-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flash_agent"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
flash-core = { path = "../core" }
flash-provider = { path = "../provider" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
flash-deepseek = { path = "../deepseek" }
flash-tools = { path = "../tools" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
