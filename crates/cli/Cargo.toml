[package]
name = "flash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flash"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
flash-agent = { path = "../agent" }
flash-core = { path = "../core" }
flash-deepseek = { path = "../deepseek" }
flash-eval = { path = "../eval" }
flash-provider = { path = "../provider" }
flash-tui = { path = "../tui" }
flash-tools = { path = "../tools" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
